# KofTwentyTwo pre-commit configuration, from KofTwentyTwo/standards
# configs/pre-commit/.pre-commit-config.yaml with the .NET hook enabled. Works
# with pre-commit and prek. Install both hook types once per clone:
#
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# Every external hook is pinned to a full commit SHA with the release in a comment
# (`pre-commit autoupdate --freeze` keeps that format). The hooks are the local half
# of the CI gates in the standards' ci-cd.md; CI runs the same tools again.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # File hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secrets (K22-CI-20): staged changes only, so it stays fast.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Workflow security (K22-CI-23).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--min-severity, medium]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Commit message: Conventional Commits header (K22-SDLC-11).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]

  # Commit message: DCO sign-off (`git commit -s`). pygrep with --negate fails when
  # no line of the message matches.
  - repo: local
    hooks:
      - id: dco-sign-off
        name: DCO sign-off present (git commit -s)
        language: pygrep
        entry: '^Signed-off-by: .+ <.+@.+>$'
        args: [--negate]
        stages: [commit-msg]

  # .NET (K22-CODE-CS): the format gate, same command as CI.
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format --verify-no-changes
        language: system
        entry: dotnet format gclo.slnx --verify-no-changes --severity warn --no-restore
        pass_filenames: false
        files: \.(cs|csproj|props|targets|editorconfig)$
