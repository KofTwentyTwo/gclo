# Weekly dependency updates for the GitHub Actions pinned in .github/workflows.
#
# NuGet packages are deliberately NOT handled here. Dependabot's NuGet updater
# cannot evaluate the WinUI project's Windows-versioned target framework
# (net10.0-windows10.0.19041.0; dependabot/dependabot-core#13923) and declares
# every newer package "not compatible", which also blocks the same packages in the
# other projects. The NuGet updates workflow (.github/workflows/nuget-updates.yml)
# does that job through `dotnet list package --outdated` instead. Dependabot
# security alerts for NuGet are unaffected: they come from the dependency graph.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      actions-all:
        patterns:
          - "*"
