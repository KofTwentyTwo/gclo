# Pull request gates (K22-CI-01): Conventional Commit title, DCO sign-off on every
# commit, and review of added dependencies, through the KofTwentyTwo standards'
# reusable workflow. Pinned by full commit SHA like any other action (K22-CI-11);
# the comment names the standards revision. Dependabot's github-actions ecosystem
# updates the SHA and the comment together.
name: pr-gates

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: KofTwentyTwo/standards/.github/workflows/pr.yml@855cf4409180d2f1aa58a062c8c140be2ac27917 # main 2026-10-09 (pre-1.0 draft)
    permissions:
      contents: read
      pull-requests: read
