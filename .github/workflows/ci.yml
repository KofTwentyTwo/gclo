# Continuous integration: build + test + coverage gate, and a formatting gate.
#
# Build bar: `dotnet build gclo.slnx -p:Platform=x64` must produce ZERO warnings,
# which -warnaserror enforces (this also fails the build on NuGetAudit
# vulnerability warnings, so known-vulnerable packages break CI).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow calls this one so a tag is gated by exactly the checks
  # a pull request is: build, coverage, formatting, and the UI end-to-end suite.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # RestoreLockedMode: the committed packages.lock.json files are the restore
      # graph; a stale lock file (a bump without 'dotnet restore --force-evaluate')
      # fails here instead of silently restoring something else.
      - name: Build solution (x64, warnings as errors)
        run: dotnet build gclo.slnx -p:Platform=x64 -warnaserror -p:RestoreLockedMode=true

      # coverage.runsettings scopes collection to the three library assemblies and
      # excludes source-generated code and the [ExcludeFromCodeCoverage] native/
      # network adapters (LibGit2GitClient, OctokitGateway). gclo.Engine.Tests
      # exercises gclo.Engine and gclo.ViewModels; gclo.Cli.Tests covers the CLI
      # (its assembly is 'gclo'). Both write into TestResults; the gate reads all.
      - name: Run engine and view-model tests with coverage
        run: dotnet test gclo.Engine.Tests --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Run CLI tests with coverage
        run: dotnet test gclo.Cli.Tests --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Enforce 100% line coverage (Engine, ViewModels, Cli)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml
          if (-not $files) {
            Write-Error 'No coverage.cobertura.xml found under TestResults. Did the coverage collector run?'
            exit 1
          }
          # Merge every collected report: the two test projects each emit their own,
          # and a package's covered lines can be split across them.
          # The CLI's assembly (and thus its coverage package) is 'gclo' — it ships as gclo.exe.
          $required = @('gclo.Engine', 'gclo.ViewModels', 'gclo')
          $failed = $false
          foreach ($name in $required) {
            $rates = foreach ($f in $files) {
              [xml]$doc = Get-Content -LiteralPath $f.FullName
              $pkg = @($doc.coverage.packages.package) | Where-Object { $_.name -eq $name }
              if ($pkg) { [double]::Parse($pkg.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture) }
            }
            if (-not $rates) {
              Write-Error "Package '$name' not found in any coverage report."
              $failed = $true
              continue
            }
            # The report with the most coverage for this package is authoritative.
            $best = ($rates | Measure-Object -Maximum).Maximum
            $percent = [math]::Round($best * 100, 2)
            Write-Host "$name line coverage: $percent% (required 100%)"
            if ($best -lt 1.0) {
              Write-Error "Coverage gate FAILED: $name line-rate $best is below the required 1.00."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'Coverage gate passed: all measured assemblies at 100%.'

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  ui-tests:
    # End-to-end FlaUI/UIA tests against the real gclo.exe. A required check on
    # main since 2026-10-09 (#54), and therefore a blocking gate for releases too.
    name: ui-tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Self-contained Windows App SDK: hosted runners do not have the runtime
      # installed. The output path is the same one AppSession resolves by default.
      - name: Build app (unpackaged, self-contained Windows App SDK)
        run: dotnet build gclo/gclo.csproj -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:RestoreLockedMode=true

      # Diagnostics for the day this job fails on a hosted runner: a TRX log of
      # the run, a screenshot of the screen at the end of every test session, and
      # the app's own activity log, all uploaded only when something failed.
      - name: Run UI tests
        env:
          GCLO_UITEST_ARTIFACTS: ${{ github.workspace }}\TestResults\ui
        run: dotnet test gclo.UiTests/gclo.UiTests.csproj --logger "trx;LogFileName=uitests.trx" --results-directory TestResults

      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-diagnostics
          path: TestResults
          if-no-files-found: warn

  format:
    name: format
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore gclo.slnx --locked-mode

      # The Kingsrook layout and every warning-severity style rule (K22-CODE-CS-02):
      # the same command CONTRIBUTING.md documents for the desk.
      - name: Verify formatting
        run: dotnet format gclo.slnx --verify-no-changes --severity warn --no-restore

      # PowerShell scripts follow the same layout (K22-CODE-SH-05).
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          # One file per call, three attempts each: PSScriptAnalyzer 1.25.0
          # intermittently throws "Object reference not set to an instance of an
          # object" from inside the analyzer (#89); a retry has always passed. A
          # file that throws three times fails the gate with the analyzer's error.
          $settings = (Resolve-Path ./PSScriptAnalyzerSettings.psd1).Path
          $scripts = Get-ChildItem -Path .github/scripts, packaging/chocolatey/tools -Recurse -Include *.ps1, *.psm1, *.psd1
          $findings = @()
          foreach ($script in $scripts)
          {
             for ($attempt = 1; $attempt -le 3; $attempt++)
             {
                try
                {
                   $findings += @(Invoke-ScriptAnalyzer -Path $script.FullName -Settings $settings -ErrorAction Stop)
                   break
                }
                catch
                {
                   if ($attempt -eq 3) { throw }
                   Write-Output "::warning file=$($script.FullName)::PSScriptAnalyzer threw on attempt $attempt ($($_.Exception.Message)); retrying."
                   Start-Sleep -Seconds 2
                }
             }
          }
          foreach ($f in $findings) { Write-Output "::error file=$($f.ScriptPath),line=$($f.Line)::$($f.RuleName): $($f.Message)" }
          if ($findings.Count -gt 0) { exit 1 }
          Write-Output 'PSScriptAnalyzer: no findings.'
