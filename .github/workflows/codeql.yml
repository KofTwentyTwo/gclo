# Static analysis (K22-CI-22): CodeQL with the security-extended suite for C# and
# for the workflows themselves, failing on alerts of high severity or above,
# through the KofTwentyTwo standards' reusable workflow. C# is compiled, so the
# analysis builds the solution exactly as CI does (x64, locked restore); the .NET
# SDK comes from global.json.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    uses: KofTwentyTwo/standards/.github/workflows/codeql.yml@ae174f54959ba4297f2ae174356c4481918fdf44 # main 2026-10-09 (pre-1.0 draft, standards#4)
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["csharp", "actions"]'
      build-mode: manual
      build-command: dotnet build gclo.slnx -p:Platform=x64 -p:RestoreLockedMode=true
      runs-on: windows-latest
      setup-dotnet: true
