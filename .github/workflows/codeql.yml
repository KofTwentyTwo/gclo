# CodeQL static analysis for C#.
#
# C# is a compiled language, so CodeQL needs a real build. We use build-mode
# "manual" and run the same x64 solution build the CI workflow uses (without
# -warnaserror - the CI workflow already gates warnings; this workflow's job is
# security analysis, and it should still scan code that has a pending warning).
name: CodeQL

# Runs on dev as well as main: feature PRs target dev (CONTRIBUTING.md), so
# scanning only main would let code reach the integration branch unanalyzed.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly scan (Mondays 06:30 UTC) so new CodeQL queries run even when the
    # code has not changed.
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      # Required for github/codeql-action to upload scan results.
      security-events: write
      # Required to fetch public CodeQL packs.
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build solution (x64)
        run: dotnet build gclo.slnx -p:Platform=x64 -p:RestoreLockedMode=true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: '/language:csharp'
