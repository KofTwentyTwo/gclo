# Release pipeline, triggered by pushing a tag that starts with 'v'
# (docs/RELEASING.md is the runbook).
#
#   v1.2.3        -> stable release  -> Velopack channel 'stable'
#   v1.2.3-beta.1 -> prerelease      -> Velopack channel 'dev'
#
# Stages, each gated on the previous one:
#   verify   - the tag is strict semver and its commit is on main
#   gates    - the full ci workflow, exactly as a pull request runs it (K22-CI-31)
#   release  - the KofTwentyTwo standards' shared Velopack workflow: locked restore,
#              Release build, tests and coverage gate, publish, vpk pack, SBOMs,
#              SHA256SUMS, provenance, draft-then-publish GitHub release. The build
#              runs inside the shared workflow, so the provenance names it as the
#              builder (SLSA Build L3, K22-CI-30).
#   packages - stable only: Scoop and Chocolatey manifests pointed at the release,
#              Chocolatey package pushed, manifests proposed as a PR against main
#   winget   - stable only, once WINGET_PACKAGE_ID is set: manifest update
#              submitted to microsoft/winget-pkgs
#   nuget    - only when the repository variable NUGET_PUBLISH is 'true'
#
# A publishing job that cannot publish FAILS; nothing is skipped quietly. winget
# is the one explicit opt-in: `wingetcreate update` needs a package that already
# exists in microsoft/winget-pkgs, and the first submission is manual and needs a
# published stable installer, so the job runs once the WINGET_PACKAGE_ID variable
# is set (docs/RELEASING.md) and fails if the token is missing from then on. The
# tokens live in the `release` environment, which only v* tags can use:
#   RELEASE_APP_PRIVATE_KEY  private key of the release GitHub App (contents +
#                   pull requests write on this repository only); the job mints a
#                   short-lived token from it, so the packaging PR's commit is
#                   signed by GitHub and the PR runs the required checks
#   CHOCO_API_KEY   chocolatey.org API key
#   WINGET_TOKEN    fine-grained token that can fork and open pull requests on
#                   public repositories (microsoft/winget-pkgs)
#   NUGET_API_KEY   nuget.org key with push rights for gclo.Engine (NUGET_PUBLISH)
# plus the repository variables RELEASE_APP_CLIENT_ID (the release App's client id)
# and WINGET_PACKAGE_ID (KofTwentyTwo.gclo, set after the one-time manual
# `wingetcreate new`).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history, so main's ancestry can be checked)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Releases are cut from main. A tag anywhere else (a feature branch, a
      # detached experiment) would otherwise publish an immutable release that
      # never passed main's gates. The shared workflow validates the tag's
      # format itself.
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "$GITHUB_SHA")"
          if git merge-base --is-ancestor "$tagged" origin/main; then
            echo "OK: $GITHUB_REF_NAME ($tagged) is contained in main."
          else
            echo "::error::Tag $GITHUB_REF_NAME points at $tagged, which is not contained in origin/main. Releases must be tagged from main (docs/RELEASING.md)."
            exit 1
          fi

  # The same gates a pull request must pass (K22-CI-31): zero-warning x64 build,
  # 100% line coverage, formatting, and the FlaUI end-to-end suite.
  gates:
    name: Gates
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The gates test what `dotnet build` produces; this job tests what ships. It
  # publishes the app exactly as the shared workflow does (same restore, build
  # and publish commands, so the same incremental obj state) and runs the FlaUI
  # suite against that published gclo.exe. v1.0.1 passed every gate and crashed
  # at startup because its published resource index was stale (#87); nothing is
  # published until this passes.
  smoke:
    name: Smoke test the published app
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No NuGet cache: a release workflow must not consume runtime-generated
      # caches (zizmor cache-poisoning); the locked restore is deterministic.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore gclo.slnx -p:Platform=x64 --locked-mode

      - name: Build Release (as the shared workflow does before publishing)
        run: dotnet build gclo.slnx -c Release -p:Platform=x64 -warnaserror --no-restore

      - name: Publish app (the shared workflow's exact command)
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          $version = $env:TAG.Substring(1);
          dotnet publish gclo/gclo.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained
          "-p:Version=$version" -p:RestoreLockedMode=true -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -o publish/app

      - name: Run the UI suite against the published exe
        env:
          GCLO_UITEST_EXE: ${{ github.workspace }}\publish\app\gclo.exe
          GCLO_UITEST_ARTIFACTS: ${{ github.workspace }}\TestResults\smoke
        run: dotnet test gclo.UiTests/gclo.UiTests.csproj --logger "trx;LogFileName=smoke.trx" --results-directory TestResults

      - name: Upload smoke test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-diagnostics
          path: TestResults
          if-no-files-found: warn

  release:
    name: Release
    needs: [verify, gates, smoke]
    uses: KofTwentyTwo/standards/.github/workflows/release-velopack.yml@40ecebae5c32d5550afb4af157eee69572bd267a # main 2026-10-10 (signs only unsigned binaries, standards#29)
    permissions:
      contents: write      # create and publish the GitHub release
      id-token: write      # sign attestations; Azure OIDC when signing
      attestations: write  # store attestations
    with:
      solution: gclo.slnx
      app-project: gclo/gclo.csproj
      app-id: gclo
      main-exe: gclo.exe
      icon: gclo/Assets/Brand/gclo.ico
      platform: x64
      runtime: win-x64
      coverage-packages: gclo.Engine,gclo.ViewModels,gclo
      coverage-minimum: 100
      test-projects: |
        gclo.Engine.Tests
        gclo.Cli.Tests
      cli-project: gclo.Cli/gclo.Cli.csproj
      # Authenticode (Azure Artifact Signing, formerly Trusted Signing) over OIDC: the
      # shared workflow signs every published exe/dll and vpk signs Setup.exe and the
      # update stub with the same identity. The identity lives in the `release`
      # environment's variables (AZURE_CLIENT_ID, AZURE_TENANT_ID,
      # AZURE_SUBSCRIPTION_ID, TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT,
      # TRUSTED_SIGNING_PROFILE, docs/RELEASING.md) and is granted only to this
      # repository's v* tags through a federated credential (#57, closes EX-0002).
      sign: true

  # The shipped artifacts carry valid Authenticode signatures: every exe inside the
  # installer, the portable zip and the CLI zip, and Setup.exe itself, verify with
  # `signtool verify /pa /all` and show the publisher the certificate profile was
  # validated for. Runs on what was actually published, so a signing step that
  # silently produced unsigned files fails the run (and the release is then
  # handled per "A broken release" in docs/RELEASING.md), not a later user.
  verify-signatures:
    name: Verify signatures on the published assets
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      K22_VERSION: ${{ needs.release.outputs.version }}
      K22_CHANNEL: ${{ needs.release.outputs.prerelease == 'true' && 'dev' || 'stable' }}
      EXPECTED_SUBJECT: ${{ vars.TRUSTED_SIGNING_SUBJECT }}
    steps:
      - name: Download the published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          gh release download $env:TAG --dir assets --pattern "gclo-$env:K22_CHANNEL-Setup.exe" --pattern "gclo-$env:K22_CHANNEL-Portable.zip" --pattern "gclo-cli-win-x64-$env:K22_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive assets/gclo-$env:K22_CHANNEL-Portable.zip -DestinationPath assets/portable
          Expand-Archive assets/gclo-cli-win-x64-$env:K22_VERSION.zip -DestinationPath assets/cli

      - name: signtool verify /pa /all on every shipped executable
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:EXPECTED_SUBJECT))
          {
             Write-Output '::error::TRUSTED_SIGNING_SUBJECT is not set in the release environment (docs/RELEASING.md).'
             exit 1
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
             Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $files = @(Get-Item assets/gclo-$env:K22_CHANNEL-Setup.exe) + @(Get-ChildItem assets/portable, assets/cli -Recurse -Include *.exe, *.dll |
             Where-Object { $_.Name -like 'gclo*' -or $_.Name -in 'Update.exe' })
          $failed = 0
          foreach ($f in $files)
          {
             & $signtool.FullName verify /pa /all /v $f.FullName | Out-Null
             $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
             $subject = $sig.SignerCertificate.Subject
             $timestamped = $null -ne $sig.TimeStamperCertificate
             if ($LASTEXITCODE -ne 0 -or $sig.Status -ne 'Valid' -or -not $timestamped -or $subject -notlike "*$env:EXPECTED_SUBJECT*")
             {
                Write-Output "::error file=$($f.Name)::signature status '$($sig.Status)', timestamped=$timestamped, subject '$subject' (expected '*$env:EXPECTED_SUBJECT*', signtool exit $LASTEXITCODE)"
                $failed++
             }
             else
             {
                Write-Output "ok   $($f.Name)  $subject  (timestamped)"
             }
          }
          if ($failed -gt 0) { exit 1 }
          Write-Output "All $($files.Count) shipped executables carry a valid, timestamped signature by '$env:EXPECTED_SUBJECT'."

  # Scoop and Chocolatey (#9), stable releases only. The repository is its own
  # Scoop bucket (bucket/gclo.json) and ships the Chocolatey package source
  # (packaging/chocolatey). Both are pointed at this release's CLI zip; the
  # Chocolatey package is pushed, and the updated manifests are proposed as a
  # pull request against main, where Scoop reads bucket/gclo.json from.
  packages:
    name: Scoop and Chocolatey
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      K22_VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The secrets context cannot be read in `if`; this step is the only one
      # besides the publishers that sees the values, and it never prints them.
      - name: Require the publishing secrets
        shell: pwsh
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $missing = @('RELEASE_APP_CLIENT_ID', 'RELEASE_APP_PRIVATE_KEY', 'CHOCO_API_KEY') | Where-Object { [string]::IsNullOrEmpty((Get-Item -Path "env:$_" -ErrorAction SilentlyContinue).Value) }
          if ($missing)
          {
             Write-Output "::error::Missing in the release environment (or repository variables): $($missing -join ', '). Add them (docs/RELEASING.md) and re-run this job."
             exit 1
          }

      - name: Download the CLI zip from the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          gh release download $env:TAG --pattern "gclo-cli-win-x64-$env:K22_VERSION.zip" --dir artifacts
          Get-ChildItem artifacts

      - name: Point the Scoop and Chocolatey manifests at this release
        id: manifests
        shell: pwsh
        run: ./.github/scripts/Update-PackageManifests.ps1 -Version $env:K22_VERSION -CliZipPath "artifacts/gclo-cli-win-x64-$env:K22_VERSION.zip"

      - name: Pack the Chocolatey package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/chocolatey | Out-Null
          choco pack packaging/chocolatey/gclo.nuspec --outputdirectory artifacts/chocolatey
          Get-ChildItem artifacts/chocolatey

      - name: Push the Chocolatey package
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: choco push (Get-ChildItem artifacts/chocolatey/*.nupkg | Select-Object -First 1).FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

      # protect-main requires signed commits and a DCO sign-off. The action only
      # signs with a bot token (a PAT is explicitly unsupported), so the PR is
      # opened with a short-lived token of the release GitHub App: GitHub signs
      # the commit, its author is the App's [bot] user (exempt from the DCO
      # check), and the PR still triggers the required checks (#81, #85).
      - name: Mint a release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a PR with the updated package manifests
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          base: main
          branch: packaging/v${{ needs.release.outputs.version }}
          delete-branch: true
          commit-message: 'build(packaging): point the Scoop and Chocolatey manifests at v${{ needs.release.outputs.version }}'
          title: 'build(packaging): point the Scoop and Chocolatey manifests at v${{ needs.release.outputs.version }}'
          body: |
            Generated by the Release workflow for tag `${{ github.ref_name }}`.

            - `bucket/gclo.json` (Scoop) and `packaging/chocolatey` now point at
              `gclo-cli-win-x64-${{ needs.release.outputs.version }}.zip`
              (SHA-256 `${{ steps.manifests.outputs.sha256 }}`).
            - `scoop update gclo` picks this up as soon as this PR is merged (Scoop
              reads the manifest from `main`); the Chocolatey package was pushed to
              chocolatey.org.

            Relates to #9.
          labels: |
            release
          add-paths: |
            bucket/gclo.json
            packaging/chocolatey/gclo.nuspec
            packaging/chocolatey/tools/chocolateyinstall.ps1

  # winget, stable releases only, once the package exists. `wingetcreate update`
  # can only update a package that already exists in microsoft/winget-pkgs; the
  # first submission is manual (docs/RELEASING.md), after which WINGET_PACKAGE_ID
  # is set and this job keeps the manifest current (re-run it on the release that
  # was bootstrapped). The job lives here, not in the shared workflow, because its
  # token belongs to this repository's `release` environment.
  winget:
    name: winget
    needs: release
    if: needs.release.outputs.prerelease == 'false' && vars.WINGET_PACKAGE_ID != ''
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    permissions: {}
    steps:
      - name: Submit winget manifest update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
          K22_VERSION: ${{ needs.release.outputs.version }}
          SETUP_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ needs.release.outputs.setup }}
          WINGETCREATE_VERSION: v1.12.13.0
          WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN))
          {
             Write-Output '::error::WINGET_PACKAGE_ID is set but WINGET_TOKEN is missing from the release environment. Add it and re-run this job.'
             exit 1
          }
          # A pinned release asset, verified against its committed SHA-256, instead
          # of whatever https://aka.ms/wingetcreate/latest redirects to today.
          $wingetcreate = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_VERSION/wingetcreate.exe" -OutFile $wingetcreate
          $actual = (Get-FileHash -LiteralPath $wingetcreate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:WINGETCREATE_SHA256)
          {
             Write-Output "::error::wingetcreate.exe hash mismatch: expected $env:WINGETCREATE_SHA256, got $actual"
             exit 1
          }
          & $wingetcreate update $env:WINGET_PACKAGE_ID --urls $env:SETUP_URL --version $env:K22_VERSION --submit --token $env:WINGET_TOKEN

  # gclo.Engine on nuget.org: opt-in through the repository variable NUGET_PUBLISH
  # (the library has no published consumers yet). Once opted in, a missing key fails.
  nuget:
    name: NuGet (gclo.Engine)
    needs: release
    if: vars.NUGET_PUBLISH == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      K22_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # ContinuousIntegrationBuild normalizes the embedded source paths so the
      # package is deterministic and SourceLink step-through works.
      - name: Pack gclo.Engine
        shell: pwsh
        run: dotnet pack gclo.Engine -c Release "-p:Version=$env:K22_VERSION" -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=true -o artifacts/nuget

      - name: Push gclo.Engine to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:NUGET_API_KEY))
          {
             Write-Output '::error::NUGET_PUBLISH is true but NUGET_API_KEY is not in the release environment.'
             exit 1
          }
          dotnet nuget push "artifacts/nuget/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
