# Release pipeline, triggered by pushing a tag that starts with 'v'.
#
#   v1.2.3        -> stable release  -> Velopack channel 'stable'
#   v1.2.3-beta.1 -> prerelease      -> Velopack channel 'dev'
#
# See docs/RELEASING.md for the full release runbook, including the secrets that
# enable the optional NuGet and winget steps.
name: Release

on:
  push:
    tags:
      - 'v*'

# Three stages, each gated on the previous:
#   verify  - the tag must be strict semver AND its commit must be on main
#   gates   - the full CI workflow (build, 100% coverage, format; UI smoke advisory)
#   release - package and publish; only runs when both stages succeeded
#
# Read-only by default; only the release job gets contents: write, which vpk
# and gh need to create the GitHub Release and upload assets to it.
permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout (full history, so main's ancestry can be checked)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          # Strict semver 2.0 (major.minor.patch with optional prerelease
          # identifiers). Build metadata ('+...') is deliberately rejected: it
          # is not meaningful to NuGet or Velopack asset naming.
          $semverPattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ($tag -notmatch $semverPattern) {
            Write-Error "Tag '$tag' is not a valid release tag. Expected vMAJOR.MINOR.PATCH with an optional prerelease suffix, e.g. v1.2.3 or v1.2.3-beta.1."
            exit 1
          }
          $version = $tag.Substring(1)
          $prerelease = $version.Contains('-')
          $channel = if ($prerelease) { 'dev' } else { 'stable' }
          Write-Host "Tag: $tag | Version: $version | Prerelease: $prerelease | Velopack channel: $channel"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$($prerelease.ToString().ToLower())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$channel"

      # Releases are cut from main (docs/RELEASING.md). A tag anywhere else -
      # a feature branch, an unmerged dev commit, a detached experiment - would
      # otherwise publish an immutable release that never passed main's gates.
      # To exercise the failure path, push a 'v*' tag on a commit that is not
      # on main: this step fails and nothing downstream runs.
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "$GITHUB_SHA")"
          if git merge-base --is-ancestor "$tagged" origin/main; then
            echo "OK: $GITHUB_REF_NAME ($tagged) is contained in main."
          else
            echo "::error::Tag $GITHUB_REF_NAME points at $tagged, which is not contained in origin/main. Releases must be tagged from main (docs/RELEASING.md)."
            exit 1
          fi

  # The same gates a pull request must pass: zero-warning x64 build, 100% line
  # coverage on Engine/ViewModels/Cli, and formatting. If any of those fails, this
  # job fails and release is skipped. The FlaUI UI smoke suite runs too but is
  # advisory here, exactly as it is not a required check on main: hosted-runner UI
  # automation is not yet proven stable enough to hold an immutable tag hostage.
  # Documented exception per #44; flip ui-tests-advisory to false (and add the job
  # to main's required checks) once the suite has earned it.
  gates:
    name: Gates
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ui-tests-advisory: true

  release:
    name: Build, package, and publish
    needs: [verify, gates]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # Optional secrets. Empty when not configured; the steps that need them
      # check for that in their `if:` and are skipped cleanly.
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      REPO_URL: https://github.com/KofTwentyTwo/gclo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # ----------------------------------------------------------------------
      # (a) CLI: self-contained single-file publish, zipped as a release asset.
      # ----------------------------------------------------------------------
      - name: Publish CLI (win-x64, single file)
        run: dotnet publish gclo.Cli -c Release -r win-x64 --self-contained -p:Version=${{ needs.verify.outputs.version }} -p:PublishSingleFile=true -o publish/cli

      - name: Zip CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path publish/cli/* -DestinationPath artifacts/gclo-cli-win-x64.zip

      # ----------------------------------------------------------------------
      # (b) WinUI app: unpackaged (no MSIX) self-contained publish, then
      # packaged with Velopack. vpk upload creates the GitHub Release itself
      # and attaches the Setup, portable, and delta assets to it.
      # ----------------------------------------------------------------------
      - name: Publish app for Velopack (unpackaged win-x64)
        run: dotnet publish gclo/gclo.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -p:Version=${{ needs.verify.outputs.version }} -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -o publish/app

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous Velopack release (delta baseline)
        # The very first release on a channel has nothing to download; that is
        # fine - vpk pack simply produces no delta package - so a failure here
        # must not fail the release.
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $preFlag = @()
          if ('${{ needs.verify.outputs.prerelease }}' -eq 'true') { $preFlag = @('--pre') }
          vpk download github --repoUrl $env:REPO_URL --token $env:GITHUB_TOKEN --channel ${{ needs.verify.outputs.channel }} @preFlag

      - name: Velopack pack
        run: vpk pack --packId gclo --packVersion ${{ needs.verify.outputs.version }} --packDir publish/app --mainExe gclo.exe --channel ${{ needs.verify.outputs.channel }} --icon gclo/Assets/Brand/gclo.ico

      # This repo has immutable releases: assets freeze the moment a release is
      # PUBLISHED. So vpk creates a DRAFT (no --publish), every asset and the
      # changelog land while it is still mutable, and publishing happens last.
      - name: Velopack upload (creates a draft GitHub Release)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $preFlag = @()
          if ('${{ needs.verify.outputs.prerelease }}' -eq 'true') { $preFlag = @('--pre') }
          vpk upload github --repoUrl $env:REPO_URL --token $env:GITHUB_TOKEN --channel ${{ needs.verify.outputs.channel }} --releaseName "gclo ${{ needs.verify.outputs.version }}" --tag $env:GITHUB_REF_NAME @preFlag

      - name: Attach CLI zip to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME artifacts/gclo-cli-win-x64.zip --clobber

      # Auto-generated changelog (categorized by labels via .github/release.yml).
      - name: Generate release changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$env:GITHUB_REF_NAME --jq .body | Out-File -FilePath notes.md -Encoding utf8
          gh release edit $env:GITHUB_REF_NAME --notes-file notes.md

      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false

      # ----------------------------------------------------------------------
      # (c) NuGet: pack gclo.Engine and push to nuget.org - only when the
      # NUGET_API_KEY secret is configured on the repository.
      # ----------------------------------------------------------------------
      - name: Pack gclo.Engine
        run: dotnet pack gclo.Engine -c Release -p:Version=${{ needs.verify.outputs.version }} -o artifacts/nuget

      - name: Push gclo.Engine to nuget.org
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      # ----------------------------------------------------------------------
      # (d) winget: update the KofTwentyTwo.gclo manifest for STABLE releases
      # only, and only when the WINGET_TOKEN secret is configured.
      #
      # NOTE: the FIRST winget submission cannot be automated with `update` -
      # the package must already exist in microsoft/winget-pkgs. Bootstrap it
      # once manually with `wingetcreate new <Setup.exe url>` (see
      # docs/RELEASING.md), then this step keeps it current.
      # ----------------------------------------------------------------------
      - name: Submit winget manifest update
        if: needs.verify.outputs.prerelease == 'false' && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # Velopack names the installer '<packId>-<channel>-Setup.exe'.
          $setupUrl = "$env:REPO_URL/releases/download/$env:GITHUB_REF_NAME/gclo-stable-Setup.exe"
          .\wingetcreate.exe update KofTwentyTwo.gclo --urls $setupUrl --version ${{ needs.verify.outputs.version }} --submit --token $env:WINGET_TOKEN
