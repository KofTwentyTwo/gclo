name: Original gclo UI qualification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  ui-tests:
    name: ui-tests
    runs-on: kof-windows-vm6218
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: builtin:checkout
      with:
        persist-credentials: false
    - name: Set up original declared SDK401
      uses: self:KofTwentyTwo/platform-ci/kof-release-sdk@0ab685c7317b3deb6cd057530b658f06fe8e5408
    - name: Build app (unpackaged, self-contained Windows App SDK)
      run: dotnet build gclo/gclo.csproj -p:Platform=x64 -p:WindowsPackageType=None
        -p:WindowsAppSDKSelfContained=true -p:RestoreLockedMode=true
    - name: Run UI tests
      env:
        GCLO_UITEST_ARTIFACTS: ${{ github.workspace }}\TestResults\ui
      run: dotnet test gclo.UiTests/gclo.UiTests.csproj --logger "trx;LogFileName=uitests.trx"
        --results-directory TestResults
    - name: Upload UI test diagnostics
      if: failure()
      uses: self:KofTwentyTwo/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ui-test-diagnostics
        path: TestResults
        if-no-files-found: warn
