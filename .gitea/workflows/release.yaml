# Gitea release for gclo: tag v* -> verified, built, Authenticode-signed (Azure Artifact Signing),
# Velopack-packed and published to this repository's Gitea release. Replaces release.yml's
# build/sign/publish path. Gitea issues no OIDC token, so the identity is the existing
# gclo-release-signing Entra app authenticated by the AZURE_CLIENT_SECRET repository secret
# (variables AZURE_* / ARTIFACT_SIGNING_*). A missing value fails the run; nothing unsigned is published.
name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: kof-windows-amd64
    timeout-minutes: 90
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      ARTIFACT_SIGNING_SUBJECT: ${{ vars.ARTIFACT_SIGNING_SUBJECT }}
      TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    steps:
      - uses: builtin:checkout
      - name: Release
        shell: pwsh
        run: ./.gitea/scripts/Release.ps1
